<meta http-equiv="Content-Security-Policy"

<title>Dolomiten Winterreise 2026</title>
<style>
  /* ---------- Design-Tokens (hell/dunkel) ---------- */
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1f2a2e; --muted:#5d6b70; --line:#dcd7cc;
    --accent:#1f6f6b; --accent-ink:#ffffff; --warn:#b4540a; --ok:#2f7d3a; --bad:#a32a2a;
    --chip:#e8efee; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14191b; --card:#1c2326; --ink:#e8eceb; --muted:#9aa8ac; --line:#2e393d;
           --accent:#4fb3ad; --accent-ink:#0b1415; --warn:#e69a52; --ok:#6fcf7c; --bad:#e57373;
           --chip:#26343a; --shadow:none; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:16px;max-width:1100px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.5rem}
  .sub{color:var(--muted);font-size:.9rem}
  main{max-width:1100px;margin:0 auto;padding:0 16px 64px}
  h2{margin:24px 0 8px;font-size:1.2rem}
  h3{margin:0 0 4px;font-size:1.05rem}

  /* Navigation */
  nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  nav button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
       padding:8px 14px;border-radius:999px;cursor:pointer}
  nav button[aria-current="true"],.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.small{padding:4px 10px;font-size:.85rem}
  .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  /* Funnel (Long -> Short) */
  .funnel{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .funnel div{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .funnel b{font-size:1.4rem;display:block}

  /* Karten */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  .card.faded{opacity:.6}
  .chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
  .chip{background:var(--chip);border-radius:999px;padding:1px 9px;font-size:.78rem}
  .warn{color:var(--warn)} .ok{color:var(--ok)} .bad{color:var(--bad)}
  ul.tight{margin:4px 0;padding-left:18px}
  .muted{color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .bar{display:grid;grid-template-columns:70px 1fr;gap:6px;align-items:center;font-size:.8rem}
  .bar i{display:block;height:6px;border-radius:3px;background:var(--accent)}
  .bar span{background:var(--line);border-radius:3px;height:6px;display:block}
  textarea,input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
  input[type=number]{width:70px}
  table{border-collapse:collapse;width:100%;font-size:.88rem}
  th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
  .scroll{overflow-x:auto}
  .callout{border-left:4px solid var(--warn);background:var(--card);padding:10px 14px;border-radius:8px;margin:8px 0}
  svg.map{width:100%;height:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
  svg text{fill:var(--ink);font-size:11px}

  /* Praesentation */
  .slide{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:12px;
         background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
  .slide h2{font-size:2rem;margin:0}
  .slide .big{font-size:1.1rem}
  .pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
  @media print{ nav,.pager,.funnel,header .sub{display:none} body{background:#fff;color:#000} }
  @media (max-width:560px){ .slide{padding:18px} .slide h2{font-size:1.5rem} }
  .place-photo{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin:0 0 10px;border:1px solid var(--line)}
  .place-photo.hero{aspect-ratio:21/9;max-height:320px}
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0 4px}
  .media-item{margin:0}
  .media-item img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
  .media-item figcaption{font-size:.75rem;color:var(--muted);margin-top:4px;line-height:1.3}
  .img-credit{font-size:.72rem;color:var(--muted);margin-top:6px}
  .score-bars{display:grid;gap:8px;margin:10px 0 0}
  .section-impressions{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);clear:both}
  .section-impressions h4{margin:0 0 10px;font-size:.95rem;font-weight:600}
  @media (max-width:560px){
    .score-bars{margin-bottom:4px}
    .bar{grid-template-columns:6.5rem minmax(0,1fr);font-size:.78rem;gap:8px}
    .section-impressions{margin-top:18px;padding-top:14px}
    .media-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0}
    .media-item figcaption{font-size:.7rem}
  }
</style>
</head>

/* DOM-Helfer: erzeugt Elemente ausschließlich über textContent/Attribute.
   SICHERHEIT: Es wird nirgends innerHTML mit Nutzerdaten verwendet → kein XSS
   durch Notizen oder importierte JSON-Dateien. */
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, String(v));
  }
  kids.flat().forEach(c => {
    if (c == null || c === false) return;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  });
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs = {}, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  if (text != null) e.textContent = text;
  return e;
}
const byId = id => PLACES.find(p => p.id === id);
function imgEl(src, alt, className) {
  if (!src) return null;
  return el("img", { class: className, src, alt: alt || "", loading: "lazy", decoding: "async",
    onerror: e => { e.target.hidden = true; } });
}
function mediaGrid(items) {

}

/* SICHERHEIT (Eingabevalidierung): Daten aus localStorage/Import werden nie blind übernommen,
   sondern gegen eine Whitelist (bekannte IDs, Zahlenbereiche, Textlängen) geprüft. */
function sanitize(raw) {
  const s = defaultState();
  if (!raw || typeof raw !== "object") return s;
  if (raw.tab) s.tab = normalizeTab(raw.tab);
  if (raw.weights && typeof raw.weights === "object")
    for (const c of CRITERIA) {
      const n = Number(raw.weights[c.key]);
      if (Number.isFinite(n)) s.weights[c.key] = Math.min(5, Math.max(0, Math.round(n)));
    }
  const known = new Set(PLACES.map(p => p.id));
  if (raw.short && typeof raw.short === "object")
    for (const id of Object.keys(raw.short)) if (known.has(id) && raw.short[id] === true) s.short[id] = true;
  if (raw.notes && typeof raw.notes === "object")
    for (const id of Object.keys(raw.notes)) if (known.has(id)) s.notes[id] = String(raw.notes[id]).slice(0, 1000);
  if (Array.isArray(raw.route))
    s.route = raw.route.filter(r => r && known.has(r.id)).slice(0, 8)
      .map(r => ({ id: r.id, nights: Math.min(8, Math.max(1, Math.round(Number(r.nights)) || 1)) }));
  if (raw.transit && typeof raw.transit === "object") {
    s.transit.out = raw.transit.out !== false;
    s.transit.back = raw.transit.back !== false;
  }
  const qids = new Set(QUESTIONS.map(q => q.id));
  if (raw.answers && typeof raw.answers === "object")
    for (const id of Object.keys(raw.answers)) if (qids.has(id)) s.answers[id] = String(raw.answers[id]).slice(0, 1000);
  if (raw.checks && typeof raw.checks === "object")
    for (const i of Object.keys(raw.checks)) if (Number(i) >= 0 && Number(i) < CHECKLIST.length && raw.checks[i] === true) s.checks[i] = true;
  return s;
}
function load() {
  try { return sanitize(JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch (e) { return defaultState(); }          // Storage kann blockiert/leer sein → Defaults
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignorieren */ }
}

/* ---------- Bewertung & Fahrzeit ---------- */
/* Passung 0–100: gewichteter Mittelwert der Kriterien-Scores (1–5). */
function fit(p) {
  let sum = 0, wsum = 0;
  for (const c of CRITERIA) { const w = state.weights[c.key]; sum += w * p.s[c.key]; wsum += w; }
  return wsum === 0 ? 0 : Math.round((sum / (wsum * 5)) * 100);
}
/* Grobe Fahrzeit: Luftlinie × 1,4 (Serpentinen) bei Ø 50 km/h. Nur zur Orientierung! */
function km(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function driveMin(a, b) { return Math.round(km(a, b) * 1.4 / 50 * 60 / 5) * 5; }
/* Fahrzeit ab Bremen: Luftlinie × 1,22 (Autobahnfaktor) bei Ø 85 km/h inkl. Pausen. Nur Schätzung! */
function homeMin(p) { return Math.round(km(HOME, p) * 1.22 / 85 * 60 / 15) * 15; }
const availNights = () => TOTAL_NIGHTS - (state.transit.out ? 1 : 0) - (state.transit.back ? 1 : 0);
const routeStart = () => addDays(START, state.transit.out ? 1 : 0);
const fmtMin = m => `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;

  }});

    el("button", { class: "btn", onclick: () => imp.click() }, "Import"),

/* ---------- 2 · Long-List ---------- */
let filters = { dogOk: false, winterOk: false, italien: false, sort: "fit" };

  const box = el("div");
  box.append(el("h2", {}, "Long-List: alle Kandidaten"),

  const wbox = el("div", { class: "card" }, el("h3", {}, "Eure Prioritäten"));

  for (const c of CRITERIA) {
    const out = el("b", {}, state.weights[c.key]);
    grid.append(el("div", {},
      el("label", { for: "w" + c.key }, c.label + ": ", out),
      el("input", { type: "range", id: "w" + c.key, min: 0, max: 5, step: 1, value: state.weights[c.key], style: "width:100%",

function bar(label, v) {
  return el("div", { class: "bar" }, el("span", {}, label), el("span", {}, el("i", { style: `width:${v * 20}%` })));
}
function placeCard(p) {

  card.append(

      el("h3", {}, p.name),
      el("button", { class: "btn small" + (sel ? " on" : ""), "aria-pressed": String(sel),
        onclick: () => { if (sel) delete state.short[p.id]; else state.short[p.id] = true; save(); render(); } },
        sel ? "♥ Short-List" : "♡ merken")),
    el("div", { class: "muted" }, p.region + " · Passung ", el("b", {}, fit(p) + " %"), ` · ≈ ${fmtMin(homeMin(p))} ab ${HOME.name}`),
    el("div", { class: "chips" }, p.tags.map(t => el("span", { class: "chip" }, t))),

  const scores = el("div", { class: "score-bars" });

  card.append(scores);
  const actGrid = mediaGrid(p.media);
  if (actGrid) {
    card.append(el("div", { class: "section-impressions" },
      el("h4", {}, "Geplante Eindrücke"),
      actGrid));
  }
  card.append(el("details", {}, el("summary", {}, "Wandern, Highlights, Hund & Risiko"),
    el("b", {}, "Wanderungen"), el("ul", { class: "tight" }, p.hikes.map(x => el("li", {}, x))),
    el("b", {}, "Highlights"), el("ul", { class: "tight" }, p.highlights.map(x => el("li", {}, x))),
    el("p", {}, "🐕 ", p.dog), el("p", { class: "warn" }, "⚠ ", p.risk)));
  card.append(el("textarea", { rows: 2, maxlength: 1000, placeholder: "Eure Notiz (keine persönlichen Daten)…", "aria-label": "Notiz zu " + p.name,
    oninput: e => { state.notes[p.id] = e.target.value; save(); } }));
  card.querySelector("textarea").value = state.notes[p.id] || "";
  return card;
}

/* ---------- 3 · Short-List & Route ---------- */
function vShort() {
  const box = el("div");
  const ids = Object.keys(state.short);
  box.append(el("h2", {}, "Short-List"));
  if (!ids.length) box.append(el("p", { class: "muted" }, "Noch leer – merkt euch in der Long-List Orte mit ♡, oder startet unten mit einem Preset."));
  else {
    const rows = ids.map(byId).sort((a, b) => fit(b) - fit(a));
    box.append(el("div", { class: "scroll" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", {}, "Ort"), el("th", {}, "Passung"), ...CRITERIA.map(c => el("th", {}, c.label.split(" ")[0])))),
      el("tbody", {}, rows.map(p => el("tr", {}, el("td", {}, p.name), el("td", {}, fit(p) + " %"), ...CRITERIA.map(c => el("td", {}, p.s[c.key]))))))));
  }

  /* Presets */
  box.append(el("h2", {}, "Routen-Vorschläge"));
  box.append(el("div", { class: "grid" }, PRESETS.map(pr => el("div", { class: "card" },
    el("h3", {}, pr.name), el("p", {}, pr.desc),
    el("button", { class: "btn small", onclick: () => { state.route = pr.stops.map(([id, n]) => ({ id, nights: n })); pr.stops.forEach(([id]) => state.short[id] = true); save(); render(); } }, "Übernehmen")))));

  /* Routen-Builder */
  box.append(el("h2", {}, "Eure Route"));
  const tcard = el("div", { class: "card" }, el("h3", {}, "Anreise & Rückreise ab Bremen (≈ 1.000 km)"),
    el("div", { class: "row" },
      el("label", {}, el("input", { type: "checkbox", checked: state.transit.out, onchange: e => { state.transit.out = e.target.checked; save(); render(); } }), " Zwischenübernachtung Hinreise (29.11., München)"),
      el("label", {}, el("input", { type: "checkbox", checked: state.transit.back, onchange: e => { state.transit.back = e.target.checked; save(); render(); } }), " Zwischenübernachtung Rückreise (06.12.)")),
    el("p", { class: "muted" }, "Ohne Zwischenstopp bleiben mehr Nächte vor Ort, aber ca. 10 h Fahrt am Stück – für Fahrer und Hund anstrengend."));
  box.append(tcard);
  const avail = availNights();
  const sumN = state.route.reduce((a, r) => a + r.nights, 0);
  const status = sumN === avail ? el("span", { class: "ok" }, `✓ ${avail} Nächte vor Ort verplant`)
                                : el("span", { class: "warn" }, `${sumN}/${avail} Nächte – ${sumN < avail ? "noch " + (avail - sumN) + " übrig" : (sumN - avail) + " zu viel"}`);
  box.append(el("p", {}, status));
  if (state.route.length < 3 || state.route.length > 4)
    box.append(el("p", { class: "warn" }, "Hinweis: Gewünscht sind 3–4 Stationen (aktuell " + state.route.length + ")."));

  const rb = el("div");
  const routeList = el("div", { class: "grid" });
  state.route.forEach((r, i) => {
    const p = byId(r.id);
    const prev = i > 0 ? byId(state.route[i - 1].id) : null;
    const mins = prev ? driveMin(prev, p) : 0;
    const routeCard = el("div", { class: "card" });
    const routeImg = imgEl(p.img, p.name, "place-photo");
    if (routeImg) routeCard.append(routeImg);
    routeCard.append(
      el("h3", {}, `${i + 1}. ${p.name}`),
      prev ? el("div", { class: mins > 180 ? "warn" : "muted" }, `≈ ${fmtMin(mins)} ab ${prev.name} (grobe Schätzung${mins > 180 ? " – lang!" : ""})`)
           : el("div", { class: "muted" }, `≈ ${fmtMin(homeMin(p))} ab ${HOME.name} (Schätzung, ohne Pausen)`),
      el("div", { class: "row", style: "margin-top:6px" },
        el("label", { for: "n" + i }, "Nächte:"),
        el("input", { type: "number", id: "n" + i, min: 1, max: 8, value: r.nights, onchange: e => { r.nights = Math.min(8, Math.max(1, Math.round(Number(e.target.value)) || 1)); save(); render(); } }),
        el("button", { class: "btn small", "aria-label": "nach oben", onclick: () => move(i, -1) }, "↑"),
        el("button", { class: "btn small", "aria-label": "nach unten", onclick: () => move(i, 1) }, "↓"),
        el("button", { class: "btn small", onclick: () => { state.route.splice(i, 1); save(); render(); } }, "Entfernen")));
    routeList.append(routeCard);
  });
  rb.append(routeList);
  function move(i, d) { const j = i + d; if (j < 0 || j >= state.route.length) return; [state.route[i], state.route[j]] = [state.route[j], state.route[i]]; save(); render(); }

  const sel = el("select", { "aria-label": "Station hinzufügen" }, el("option", { value: "" }, "Station hinzufügen…"),

  sel.addEventListener("change", () => { if (!sel.value) return; state.route.push({ id: sel.value, nights: Math.max(1, avail - sumN) }); save(); render(); });
  rb.append(el("div", { style: "max-width:320px;margin-top:8px" }, sel));
  box.append(rb);

  if (state.route.length) { box.append(el("h2", {}, "Karte (schematisch)"), routeMap(), vTimeline(), el("h2", {}, "Tagesplan (Entwurf)"), el("p", { class: "muted" }, "Rhythmus: früh los, nachmittags zurück in die Ferienwohnung; 50/50 Highlight- und Ruhetage."), vDayPlan()); }
  return box;
}

/* Schematische Karte: einfache lineare Projektion der lat/lon-Werte, nur inline-SVG. */
function routeMap() {
  const W = 800, H = 480, pad = 50;
  const pts = PLACES.filter(p => p.id !== "hallstatt");
  const lats = pts.map(p => p.lat), lons = pts.map(p => p.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats), minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const X = p => pad + (p.lon - minLon) / (maxLon - minLon) * (W - 2 * pad);
  const Y = p => H - pad - (p.lat - minLat) / (maxLat - minLat) * (H - 2 * pad);
  const s = svg("svg", { class: "map", viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Schematische Routenkarte" });
  pts.forEach(p => { s.append(svg("circle", { cx: X(p), cy: Y(p), r: 4, fill: "#9aa8ac" }), svg("text", { x: X(p) + 7, y: Y(p) + 4, "fill-opacity": .6 }, p.name.split(" ")[0])); });
  const route = state.route.map(r => byId(r.id)).filter(p => p.id !== "hallstatt");
  for (let i = 1; i < route.length; i++)
    s.append(svg("line", { x1: X(route[i - 1]), y1: Y(route[i - 1]), x2: X(route[i]), y2: Y(route[i]), stroke: "#1f6f6b", "stroke-width": 3, "stroke-dasharray": "6 4" }));
  route.forEach((p, i) => s.append(svg("circle", { cx: X(p), cy: Y(p), r: 11, fill: "#1f6f6b" }), svg("text", { x: X(p), y: Y(p) + 4, "text-anchor": "middle", style: "fill:#fff;font-weight:bold" }, i + 1)));
  return s;
}

/* ---------- Tagesplan-Entwurf ----------
   Rhythmus (eure Wahl): früh los, nachmittags zurück in die Ferienwohnung (Kamin, Lesen, Kochen).
   Ankunftstage = ruhig (Fahrt + Einkauf + Kurzspaziergang), Folgetage wechseln zwischen Highlight (3–4 h) und Ruhe. */
const MUC = { name: "München", lat: 48.137, lon: 11.575 };
/* München→Südtirol: überwiegend Autobahn (Brenner), daher Ø 70 km/h bei Faktor 1,35 (≈ 3,5 h bis Bozen). Schätzung! */
function leg(a, b) {
  if (a === HOME) return homeMin(b);
  if (a === MUC) return Math.round(km(a, b) * 1.35 / 70 * 60 / 15) * 15;
  return driveMin(a, b);
}
function buildDays() {
  const days = []; let d = 0;
  const push = (title, items) => days.push({ date: addDays(START, d++), title, items });
  if (state.transit.out)
    push("Anreise → München", ["Früh starten, alle ~2 h Pause für den Corgi (Wiese/Raststätte)", "Übernachtung in München (Hund erlaubt prüfen)", "1. Advent: Christkindlmarkt/Altstadt nur kurz, Hundeeinschränkungen prüfen"]);
  state.route.forEach((r, i) => {
    const p = byId(r.id), f = FOOD[p.id] || {};
    const prev = i === 0 ? (state.transit.out ? MUC : HOME) : byId(state.route[i - 1].id);
    for (let n = 0; n < r.nights; n++) {
      const hike = p.hikes[(i + n) % p.hikes.length];
      if (n === 0) {
        push(`Ankunft ${p.name}`, [`🚗 ≈ ${fmtMin(leg(prev, p))} (Schätzung, ohne Pausen)`, "Ferienwohnung beziehen, Kamin an, Einkauf (" + (f.kochen || "regional") + ")", "🥾 Kurzspaziergang vor Ort (~1 h)", "🍜 Abends kochen: " + (f.asia || "asiatisch mit Vorrat")]);
      } else if (n % 2 === 1) {
        push(`Highlight-Tag · ${p.name}`, ["Früh los (ca. 9 Uhr): 🥾 " + hike, "☕ Café-Stopp: " + (f.cafe || "Café vor Ort"), "✨ " + p.highlights[(i + n) % p.highlights.length], "Nachmittags (~15 Uhr) zurück, Kamin & Lesen, abends Restaurant oder Wok"]);
      } else {
        push(`Ruhetag · ${p.name}`, ["Spät frühstücken, kurze Runde (1–1,5 h) im Ort", "☕ Café: " + (f.cafe || "Café vor Ort"), "📖 Leseecke & Kamin, 🍜 Kochprojekt (asiatisch)"]);
      }
    }
  });
  if (state.transit.back) {
    push("Rückreise → München", ["Frühstück, Auto packen, früh los", "Übernachtung München (Hund erlaubt prüfen)"]);
    push("Heimreise → Bremen", ["≈ 7–8 h Fahrt, Pausen für Corgi alle ~2 h"]);
  } else {
    push("Heimreise → Bremen", ["≈ 10 h Fahrt: sehr früh los, Pausen für Corgi alle ~2 h (lang!)"]);
  }
  return days;
}
function vDayPlan() {
  return el("div", { class: "grid" }, buildDays().map(dy => el("div", { class: "card" },
    el("div", { class: "muted" }, fmtDate(dy.date)), el("h3", {}, dy.title), el("ul", { class: "tight" }, dy.items.map(x => el("li", {}, x))))));
}

function vTimeline() {
  let day = state.transit.out ? 1 : 0;
  const rows = [];
  if (state.transit.out) rows.push(el("tr", {}, el("td", {}, "→"), el("td", {}, "Anreise: Zwischenübernachtung (München)"), el("td", {}, `${fmtDate(START)} → ${fmtDate(addDays(START, 1))}`), el("td", {}, 1)));
  state.route.forEach((r, i) => {
    const p = byId(r.id), a = addDays(START, day), b = addDays(START, day + r.nights);
    day += r.nights;
    rows.push(el("tr", {}, el("td", {}, i + 1), el("td", {}, p.name), el("td", {}, `${fmtDate(a)} → ${fmtDate(b)}`), el("td", {}, r.nights)));
  });
  if (state.transit.back) rows.push(el("tr", {}, el("td", {}, "←"), el("td", {}, "Rückreise: Zwischenübernachtung"), el("td", {}, `${fmtDate(addDays(START, 7))} → ${fmtDate(addDays(START, 8))}`), el("td", {}, 1)));
  return el("div", { class: "scroll", style: "margin-top:12px" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, "#"), el("th", {}, "Station"), el("th", {}, "Zeitraum"), el("th", {}, "Nächte"))), el("tbody", {}, rows)));
}

/* ---------- 4 · Präsentation ---------- */
function vPresent() {
  const box = el("div");
  if (!state.route.length) { box.append(el("h2", {}, "Präsentation"), el("p", { class: "muted" }, "Erst eine Route in Schritt 3 anlegen.")); return box; }
  const slides = [];
  /* Folie 1: Titel */
  slides.push(el("div", { class: "slide" },
    el("h2", {}, "Dolomiten Winterreise"), el("div", { class: "big" }, "29.11. – 07.12.2026 · 8 Nächte · ab Bremen"),
    el("div", {}, "2 Erwachsene · 1 Corgi · Mercedes A 140"), el("div", { class: "chips" }, ["Wandern", "Wellness", "Kochen", "Lesen"].map(t => el("span", { class: "chip" }, t)))));
  /* Folie 2: Überblick */
  slides.push(el("div", { class: "slide" }, el("h2", {}, "Die Route"), routeMap(), vTimeline()));
  /* Folien pro Station */
  let day = state.transit.out ? 1 : 0;
  state.route.forEach((r, i) => {
    const p = byId(r.id), prev = i > 0 ? byId(state.route[i - 1].id) : null;
    const a = addDays(START, day), b = addDays(START, day + r.nights); day += r.nights;
    const slide = el("div", { class: "slide" });
    const slideImg = imgEl(p.img, p.name, "place-photo hero");
    if (slideImg) slide.append(slideImg);
    if (p.media?.length) slide.append(mediaGrid(p.media));
    slide.append(
      el("div", { class: "muted" }, `Station ${i + 1} von ${state.route.length} · ${fmtDate(a)} → ${fmtDate(b)} · ${r.nights} Nächte`),
      el("h2", {}, p.name), el("div", { class: "muted" }, p.region),
      prev ? el("div", { class: "muted" }, `🚗 ≈ ${fmtMin(driveMin(prev, p))} ab ${prev.name} (Schätzung)`) : el("div", { class: "muted" }, `🚗 ≈ ${fmtMin(homeMin(p))} ab ${HOME.name}${state.transit.out ? " (verteilt auf 2 Tage, 1 Zwischenübernachtung)" : ""}`),
      el("p", { class: "big" }, p.why),
      el("div", {}, el("b", {}, "🥾 Wandern"), el("ul", { class: "tight" }, p.hikes.map(x => el("li", {}, x)))),
      el("div", {}, el("b", {}, "✨ Highlights"), el("ul", { class: "tight" }, p.highlights.map(x => el("li", {}, x)))),
      el("div", {}, "🐕 ", p.dog), el("div", { class: "warn" }, "⚠ ", p.risk),
      state.notes[p.id] ? el("div", { class: "callout" }, "📝 ", state.notes[p.id]) : null);
    slides.push(slide);
  });
  slides.push(el("div", { class: "slide" }, el("h2", {}, "Tagesplan"), vDayPlan()));
  /* Schlussfolie */
  slides.push(el("div", { class: "slide" }, el("h2", {}, "Vor der Abfahrt"),
    el("ul", { class: "tight" }, CHECKLIST.map(t => el("li", {}, t)))));

  state.slide = Math.min(state.slide, slides.length - 1);
  const holder = el("div"); holder.append(slides[state.slide]);
  const info = el("span", { class: "muted" });
  const go = d => { state.slide = Math.min(slides.length - 1, Math.max(0, state.slide + d)); save(); holder.replaceChildren(slides[state.slide]); info.textContent = `${state.slide + 1} / ${slides.length}`; };
  info.textContent = `${state.slide + 1} / ${slides.length}`;
  box.append(el("h2", {}, "Präsentation"), holder,
    el("div", { class: "pager" }, el("button", { class: "btn", onclick: () => go(-1) }, "← zurück"), info, el("button", { class: "btn primary", onclick: () => go(1) }, "weiter →")),
    el("p", { class: "muted" }, "Tipp: Pfeiltasten ← → blättern. Drucken (Strg+P) gibt alle Inhalte als PDF aus."));
  window._go = go;
  return box;
}
document.addEventListener("keydown", e => {
  if (state.tab !== "present" || !window._go || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") window._go(1);
  if (e.key === "ArrowLeft") window._go(-1);
});

function vFragen() {
  const box = el("div", {}, el("h2", {}, "Fragen & Antworten"),

  QUESTIONS.forEach(q => {
    const val = state.answers[q.id] || "";
    const input = q.type === "select"
      ? el("select", { "aria-label": q.q }, el("option", { value: "" }, "– wählen –"), ...q.opts.map(o => el("option", { value: o }, o)))
      : el("textarea", { rows: 2, maxlength: 1000, "aria-label": q.q, placeholder: q.hint || "" });
    input.value = val;

    box.append(el("div", { class: "card", style: "margin-bottom:10px" }, el("p", {}, el("b", {}, q.q)), input));

}
